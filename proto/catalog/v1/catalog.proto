// API del servicio catalog: consulta de alumnos, armas y localizaciones.
// Las entidades que devuelve están definidas en common/v1, porque también viajan en los eventos de arena.

syntax = "proto3";

package catalog.v1;

import "common/v1/catalog.proto";

option go_package = "github.com/cristianrisueo/thebattleroyale1/gen/catalog/v1;catalogv1";

// Petición para obtener un alumno por id.
message GetStudentRequest {
  string id = 1;
}

// Respuesta con el alumno solicitado.
message GetStudentResponse {
  common.v1.Student student = 1;
}

// Petición para listar todos los alumnos.
message ListStudentsRequest {}

// Respuesta con todos los alumnos.
message ListStudentsResponse {
  repeated common.v1.Student students = 1;
}

// Petición para obtener un arma por id.
message GetWeaponRequest {
  string id = 1;
}

// Respuesta con el arma solicitada.
message GetWeaponResponse {
  common.v1.Weapon weapon = 1;
}

// Petición para listar todas las armas.
message ListWeaponsRequest {}

// Respuesta con todas las armas.
message ListWeaponsResponse {
  repeated common.v1.Weapon weapons = 1;
}

// Petición para obtener una localización por id.
message GetLocationRequest {
  string id = 1;
}

// Respuesta con la localización solicitada.
message GetLocationResponse {
  common.v1.Location location = 1;
}

// Petición para listar todas las localizaciones.
message ListLocationsRequest {}

// Respuesta con todas las localizaciones.
message ListLocationsResponse {
  repeated common.v1.Location locations = 1;
}

// Servicio con todos los métodos de catálogo
service CatalogService {
  rpc GetStudent(GetStudentRequest) returns (GetStudentResponse); // Obtener un alumno por id.
  rpc ListStudents(ListStudentsRequest) returns (ListStudentsResponse); // Listar todos los alumnos.
  rpc GetWeapon(GetWeaponRequest) returns (GetWeaponResponse); // Obtener un arma por id.
  rpc ListWeapons(ListWeaponsRequest) returns (ListWeaponsResponse); // Obtener todas las armas.
  rpc GetLocation(GetLocationRequest) returns (GetLocationResponse); // Obtener una localización por id.
  rpc ListLocations(ListLocationsRequest) returns (ListLocationsResponse); // Obtener todas las localizaciones.
}